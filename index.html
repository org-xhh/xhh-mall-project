<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xhh-mall-project</title>
    <style>
      .pre-text {
        width: 100%;
        height: 300px;
        line-height: 500px;
        text-align: center;
        letter-spacing: 0.2rem;
        font-size: 2rem;
        background-image: -webkit-linear-gradient(left, #147b96, #e6d205 25%, #147b96 50%, #e6d205 75%, #147b96);
        -webkit-text-fill-color: transparent;
        -webkit-background-clip: text;
        -webkit-background-size: 200% 100%;
        -webkit-animation: maskedAnimation 4s infinite linear;
      }
      @keyframes maskedAnimation {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="pre-text">精彩即将呈现</div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      let preTextEle = document.getElementsByClassName('pre-text')[0] || {}
      if (!~window.location.href.indexOf('home')) {
        preTextEle.style.display = 'none'
      } else {
        preTextEle.style.display = 'block'
      }
    </script>
  </body>
</html>
